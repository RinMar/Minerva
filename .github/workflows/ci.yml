name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 flake8-pyproject
    - name: Run flake8
      run: flake8

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install system dependencies (musl)
      run: |
        sudo apt-get update
        sudo apt-get install -y musl musl-dev musl-tools
        sudo ln -s /lib/x86_64-linux-musl/libc.so /lib/libc.musl-x86_64.so.1 || true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary llama-cpp-python
        pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu --no-cache-dir
    - name: Run tests
      run: python -m pytest -v
