<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva — Knowledge Graph</title>

    <!-- QWebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f13;
            color: #e0e0e6;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ── Left Panel: Chat ── */
        #chat-panel {
            width: 35%;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            background: #16161d;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        #chat-header {
            padding: 18px 22px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #a78bfa;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: linear-gradient(180deg, rgba(167, 139, 250, 0.06) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a78bfa;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }

        .header-actions button:hover {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.3);
            transform: translateY(-1px);
        }

        .header-actions button:active {
            transform: translateY(0);
        }

        /* ── Profile Dropdown ── */
        .dropdown-container {
            position: relative;
        }

        #profile-dropdown {
            position: absolute;
            top: 36px;
            right: 0;
            width: 220px;
            background: #1e1e2a;
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
            overflow: hidden;
        }

        .dropdown-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #d0d0da;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .dropdown-item:hover {
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
        }

        .dropdown-item .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dropdown-item.active {
            color: #a78bfa;
            font-weight: 600;
            background: rgba(167, 139, 250, 0.05);
        }

        .edit-icon {
            opacity: 0;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
            color: #777;
        }

        .dropdown-item:hover .edit-icon {
            opacity: 1;
        }

        .edit-icon:hover {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }

        /* Rename input */
        .rename-input {
            background: #0f0f13;
            border: 1px solid #a78bfa;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            color: #e0e0e6;
            outline: none;
            width: 100%;
        }

        .dropdown-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 4px 0;
        }

        .add-profile-input-container {
            padding: 10px 14px;
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .add-profile-input-container input {
            width: 100%;
            background: #0f0f13;
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            color: #e0e0e6;
            outline: none;
        }

        .add-profile-input-container input:focus {
            border-color: #a78bfa;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 2px;
        }

        .msg {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.5;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .thinking-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            color: #f3f0ff;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: #1e1e2a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #d0d0da;
            border-bottom-left-radius: 4px;
        }

        .msg.system {
            align-self: center;
            background: transparent;
            color: #666;
            font-size: 12px;
            font-style: italic;
        }

        #chat-input-area {
            display: flex;
            align-items: flex-end;
            padding: 14px 16px;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: #12121a;
        }

        #chat-input {
            flex: 1;
            background: #1e1e2a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13.5px;
            color: #e0e0e6;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            min-height: 40px;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.4;
        }

        #chat-input:focus {
            border-color: rgba(167, 139, 250, 0.5);
        }

        #chat-input::placeholder {
            color: #555;
        }

        #send-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 14px rgba(124, 58, 237, 0.4);
        }

        #send-btn:active {
            transform: scale(0.96);
        }

        /* ── Right Panel: Graph ── */
        #graph-panel {
            flex: 1;
            position: relative;
            background: #0f0f13;
        }

        #mynetwork {
            width: 100%;
            height: 100vh;
        }

        #graph-stats {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 11px;
            color: #555;
            background: rgba(15, 15, 19, 0.85);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
        }

        /* ── Model Loader ── */
        #model-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 22, 0.95);
            display: flex; /* Visible by default, hidden when models are ready */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(8px);
            padding: 40px;
            text-align: center;
        }

        .loader-content {
            width: 100%;
            max-width: 280px;
        }

        .loader-text {
            font-size: 14px;
            font-weight: 500;
            color: #a78bfa;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .loader-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #6d28d9, #a78bfa, #6d28d9);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: loader-slide 1.5s infinite linear, loader-glow 2s infinite alternate;
        }

        @keyframes loader-slide {
            0% { transform: translateX(-100%); background-position: 100% 0; }
            100% { transform: translateX(350%); background-position: -100% 0; }
        }

        @keyframes loader-glow {
            from { box-shadow: 0 0 5px rgba(167, 139, 250, 0.2); }
            to { box-shadow: 0 0 15px rgba(167, 139, 250, 0.6); }
        }

        .loader-subtext {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            font-style: italic;
        }

        #send-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        /* ── Settings Modal ── */
        #settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-container {
            width: 100%;
            max-width: 340px;
            background: #1e1e2a;
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #a78bfa;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .performance-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .perf-opt {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .perf-opt:hover {
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .perf-opt.active {
            background: rgba(167, 139, 250, 0.15);
            border-color: #a78bfa;
            color: #a78bfa;
            font-weight: 600;
        }

        .perf-opt-title {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .perf-opt-desc {
            font-size: 10px;
            color: #666;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
        }

        .modal-btn.cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .modal-btn.save {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            color: white;
        }

        .modal-btn.save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>

<body>
    <!-- Chat Panel -->
    <div id="chat-panel">
        <div id="chat-header">
            <span>💬 Minerva Chat</span>
            <div class="header-actions">
                <div class="dropdown-container">
                    <button id="user-btn" onclick="toggleProfileDropdown()" title="Switch User">👤</button>
                    <div id="profile-dropdown">
                        <div id="user-list">
                            <!-- Populated via JS -->
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" onclick="showAddProfileInput(event)" id="add-profile-item">
                            <span>➕</span> Add New Profile...
                        </div>
                        <div class="add-profile-input-container" id="add-profile-input-area">
                            <input type="text" id="new-profile-name" placeholder="Enter name..." onkeydown="handleNewProfileKeyDown(event)">
                        </div>
                    </div>
                </div>
                <button id="settings-btn" onclick="pyBridge.handle_settings_click()" title="Settings">⚙️</button>
            </div>
        </div>
        <div id="chat-messages">
            <div class="msg system">Connected to Minerva. Your knowledge graph is loading…</div>
        </div>

        <!-- Model Loader Overlay -->
        <div id="model-loader">
            <div class="loader-content">
                <div class="loader-text" id="loader-status">Loading AI Models</div>
                <div class="loader-bar-bg">
                    <div class="loader-bar-fill"></div>
                </div>
                <div class="loader-subtext">This may take a moment on first launch...</div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" onclick="closeSettingsIfOutside(event)">
            <div class="modal-container" onclick="event.stopPropagation()">
                <div class="modal-title">⚙️ System Settings</div>
                
                <div class="setting-group">
                    <div class="setting-label">Performance Mode</div>
                    <div class="performance-options">
                        <div class="perf-opt" id="perf-low" onclick="selectPerf('low')">
                            <div class="perf-opt-title">🚀 Low</div>
                            <div class="perf-opt-desc">CPU Base (Aggressive Offloading)</div>
                        </div>
                        <div class="perf-opt" id="perf-high" onclick="selectPerf('high')">
                            <div class="perf-opt-title">⚡ High</div>
                            <div class="perf-opt-desc">Full GPU (Faster Inference)</div>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="modal-btn cancel" onclick="closeSettings()">Cancel</button>
                    <button class="modal-btn save" onclick="saveSettings()">Save & Restart</button>
                </div>
            </div>
        </div>

        <div id="chat-input-area">
            <textarea id="chat-input" placeholder="Ask Minerva something…" rows="1"></textarea>
            <button id="send-btn" class="disabled" title="Send">▶</button>
        </div>
    </div>

    <!-- Graph Panel -->
    <div id="graph-panel">
        <div id="mynetwork"></div>
        <div id="graph-stats">Nodes: 0 &nbsp;|&nbsp; Edges: 0</div>
    </div>

    <!-- vis-network loaded as a local file (same directory) -->
    <script src="vis-network.min.js"></script>

    <script>
        // ── Graph Setup ──
        var nodes = new vis.DataSet([]);
        var edges = new vis.DataSet([]);
        var network = null;

        function initNetwork() {
            const container = document.getElementById('mynetwork');

            const data = { nodes: nodes, edges: edges };

            const options = {
                interaction: {
                    dragNodes: true,
                    hover: true,
                    zoomView: true,
                    dragView: true
                },
                physics: {
                    enabled: true,
                    stabilization: { iterations: 120 },
                    barnesHut: {
                        gravitationalConstant: -3000,
                        springLength: 160,
                        springConstant: 0.03,
                        damping: 0.12
                    }
                },
                nodes: {
                    shape: 'dot',
                    size: 18,
                    font: { size: 13, color: '#ccc', face: 'Inter, sans-serif' },
                    color: {
                        background: '#7c3aed',
                        border: '#6d28d9',
                        highlight: { background: '#a78bfa', border: '#7c3aed' },
                        hover: { background: '#8b5cf6', border: '#7c3aed' }
                    },
                    borderWidth: 2
                },
                edges: {
                    color: { color: '#444', highlight: '#888', hover: '#666' },
                    font: { size: 10, color: '#777', face: 'Inter, sans-serif', strokeWidth: 0 },
                    arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                    smooth: { type: 'curvedCW', roundness: 0.15 }
                }
            };

            network = new vis.Network(container, data, options);
        }

        // ── Called from Python ──
        function updateGraph(dataUpdate) {
            if (dataUpdate.nodes) {
                var newNodes = dataUpdate.nodes.map(function(n) { return String(n.id); });
                var currentNodes = nodes.getIds();
                var nodesToRemove = currentNodes.filter(function(id) { return !newNodes.includes(String(id)); });
                if (nodesToRemove.length > 0) {
                    nodes.remove(nodesToRemove);
                }

                dataUpdate.nodes.forEach(function (n) {
                    n.id = String(n.id);
                    if (nodes.get(n.id)) {
                        nodes.update(n);
                    } else {
                        nodes.add(n);
                    }
                });
            }

            if (dataUpdate.edges) {
                var newEdges = [];
                dataUpdate.edges.forEach(function (e) {
                    var id = e.id || (String(e.from) + "_" + String(e.to) + "_" + (e.label || ""));
                    e.id = id;
                    newEdges.push(id);
                });

                var currentEdges = edges.getIds();
                var edgesToRemove = currentEdges.filter(function(id) { return !newEdges.includes(String(id)); });
                if (edgesToRemove.length > 0) {
                    edges.remove(edgesToRemove);
                }

                dataUpdate.edges.forEach(function (e) {
                    if (!edges.get(e.id)) {
                        edges.add({
                            id: e.id,
                            from: String(e.from),
                            to: String(e.to),
                            label: e.label,
                            arrows: "to"
                        });
                    } else {
                        edges.update({
                            id: e.id,
                            label: e.label
                        });
                    }
                });
            }

            // Update stats
            document.getElementById('graph-stats').textContent =
                'Nodes: ' + nodes.length + '  |  Edges: ' + edges.length;
        }

        function clearGraph() {
            nodes.clear();
            edges.clear();
            document.getElementById('graph-stats').textContent = 'Nodes: 0  |  Edges: 0';
        }


        // ── Called from Python to show a chat message ──
        function appendMessage(role, text) {
            var container = document.getElementById('chat-messages');
            var div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            var container = document.getElementById('chat-messages');
            container.innerHTML = '<div class="msg system">Connected to Minerva. Your knowledge graph is loading…</div>';
        }

        // ── Streaming support ──
        var currentMessageDiv = null;
        var currentTextDiv = null;
        var thinkingIcon = null;

        function startAssistantMessage() {
            var container = document.getElementById('chat-messages');
            currentMessageDiv = document.createElement('div');
            currentMessageDiv.className = 'msg assistant';
            
            thinkingIcon = document.createElement('div');
            thinkingIcon.className = 'thinking-icon';
            thinkingIcon.innerHTML = '🤔 <i>Thinking...</i>';
            thinkingIcon.style.display = 'none';
            thinkingIcon.style.color = '#a78bfa';
            thinkingIcon.style.fontSize = '12px';
            thinkingIcon.style.marginBottom = '6px';
            currentMessageDiv.appendChild(thinkingIcon);
            
            currentTextDiv = document.createElement('div');
            currentMessageDiv.appendChild(currentTextDiv);
            
            container.appendChild(currentMessageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendAssistantToken(token) {
            if (currentTextDiv) {
                currentTextDiv.appendChild(document.createTextNode(token));
                var container = document.getElementById('chat-messages');
                container.scrollTop = container.scrollHeight;
            }
        }

        function setAssistantState(state) {
            if (state === 'think_start') {
                if (thinkingIcon) {
                    thinkingIcon.innerHTML = '🤔 <i>Thinking...</i>';
                    thinkingIcon.style.display = 'inline-flex';
                }
            } else if (state.startsWith('action_start_')) {
                var tool = state.replace('action_start_', '');
                if (thinkingIcon) {
                    if (tool === 'retrieve') {
                        thinkingIcon.innerHTML = '🔍 <i>Retrieving knowledge...</i>';
                    } else if (tool === 'manage_memory') {
                        thinkingIcon.innerHTML = '💾 <i>Updating memory...</i>';
                    } else {
                        thinkingIcon.innerHTML = '⚙️ <i>Executing tool (' + tool + ')...</i>';
                    }
                    thinkingIcon.style.display = 'inline-flex';
                }
            } else if (state === 'think_end' || state === 'action_end' || state === 'done') {
                if (thinkingIcon) {
                    thinkingIcon.style.display = 'none';
                }
                if (state === 'done') {
                    currentMessageDiv = null;
                    currentTextDiv = null;
                    thinkingIcon = null;
                }
            }
            var container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }

        // ── Chat Input ──
        var modelReady = false;

        function sendMessage() {
            if (!modelReady) return; // Block sending while models load

            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto'; // reset height

            if (window.pyBridge) {
                pyBridge.send_message(text);
            }
        }

        var chatInput = document.getElementById('chat-input');
        
        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Prevents adding a new line
                sendMessage();
            }
        });

        // ── QWebChannel bridge ──
        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                window.pyBridge = channel.objects.pyBridge;
            });
        }

        // ── Profile Dropdown Logic ──
        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            const isVisible = dropdown.style.display === 'flex';
            
            if (!isVisible) {
                // Populate users
                pyBridge.get_user_list(function(users) {
                    const list = document.getElementById('user-list');
                    list.innerHTML = '';
                    users.forEach(u => {
                        const item = document.createElement('div');
                        item.className = 'dropdown-item';
                        item.id = 'user-item-' + u;
                        
                        const info = document.createElement('div');
                        info.className = 'user-info';
                        info.innerHTML = '👤 <span class="user-name-text">' + u + '</span>';
                        item.appendChild(info);

                        const edit = document.createElement('div');
                        edit.className = 'edit-icon';
                        edit.innerHTML = '✏️';
                        edit.title = 'Rename Profile';
                        edit.onclick = (e) => startRename(e, u);
                        item.appendChild(edit);

                        item.onclick = function(e) {
                            if (e.target.closest('.edit-icon') || e.target.closest('.rename-input')) return;
                            pyBridge.switch_profile(u);
                            toggleProfileDropdown();
                        };
                        list.appendChild(item);
                    });
                    dropdown.style.display = 'flex';
                });
            } else {
                dropdown.style.display = 'none';
                document.getElementById('add-profile-input-area').style.display = 'none';
            }
        }

        function startRename(event, oldName) {
            event.stopPropagation();
            const item = document.getElementById('user-item-' + oldName);
            const info = item.querySelector('.user-info');
            const originalHTML = info.innerHTML;
            
            info.innerHTML = '👤 ';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'rename-input';
            input.value = oldName;
            
            input.onclick = (e) => e.stopPropagation();
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    const newName = input.value.trim();
                    if (newName && newName !== oldName) {
                        pyBridge.rename_user(oldName, newName);
                        // Optimistically update UI
                        info.innerHTML = '👤 <span class="user-name-text">' + newName + '</span>';
                        item.id = 'user-item-' + newName;
                    } else {
                        info.innerHTML = originalHTML;
                    }
                } else if (e.key === 'Escape') {
                    info.innerHTML = originalHTML;
                }
            };
            
            info.appendChild(input);
            input.focus();
            input.select();
        }

        function showAddProfileInput(event) {
            event.stopPropagation();
            document.getElementById('add-profile-input-area').style.display = 'block';
            document.getElementById('new-profile-name').focus();
        }

        function handleNewProfileKeyDown(event) {
            if (event.key === 'Enter') {
                const name = event.target.value.trim();
                if (name) {
                    pyBridge.create_profile(name);
                    toggleProfileDropdown();
                }
            } else if (event.key === 'Escape') {
                document.getElementById('add-profile-input-area').style.display = 'none';
            }
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('profile-dropdown');
            const userBtn = document.getElementById('user-btn');
            if (dropdown.style.display === 'flex' && !dropdown.contains(e.target) && e.target !== userBtn) {
                dropdown.style.display = 'none';
                document.getElementById('add-profile-input-area').style.display = 'none';
            }
        });

        // ── Model Loader Controls ──
        function showModelLoader(text) {
            modelReady = false;
            const loader = document.getElementById('model-loader');
            const status = document.getElementById('loader-status');
            if (text) status.textContent = text;
            loader.style.display = 'flex';
            document.getElementById('send-btn').classList.add('disabled');
        }

        function hideModelLoader() {
            modelReady = true;
            document.getElementById('model-loader').style.display = 'none';
            document.getElementById('send-btn').classList.remove('disabled');
        }

        // ── Settings Modal Controls ──
        let selectedPerfMode = 'low';

        function showSettings() {
            const modal = document.getElementById('settings-modal');
            pyBridge.get_performance_mode(function(mode) {
                selectedPerfMode = mode;
                updatePerfUI();
                modal.style.display = 'flex';
            });
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function closeSettingsIfOutside(event) {
            if (event.target.id === 'settings-modal') closeSettings();
        }

        function selectPerf(mode) {
            selectedPerfMode = mode;
            updatePerfUI();
        }

        function updatePerfUI() {
            document.querySelectorAll('.perf-opt').forEach(opt => opt.classList.remove('active'));
            document.getElementById('perf-' + selectedPerfMode).classList.add('active');
        }

        function saveSettings() {
            closeSettings();
            pyBridge.update_performance_mode(selectedPerfMode);
        }

        initNetwork();
    </script>
</body>

</html>
