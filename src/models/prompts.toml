You prefer functional programming and immutability. You always use type hints and follow the PEP 8 style guide."""


# =============================================================================
# GENERAL PROMPT
# Fallback prompt for generic research assistance.
# =============================================================================

general_prompt = """You are Minerva, a helpful research assistant that answers questions and provides information."""


# =============================================================================
# SEARCH QUERY PROMPT
# Used to convert user questions into RAG semantic search queries.
# =============================================================================

search_query_prompt = """Convert the following user message into a concise semantic search query to look up facts in a knowledge base.
For example, if the user asks "what is my name?", write "user's name".
If the user asks "what do you know about me?", write "user profile biographical information".
Output ONLY the search query and absolutely no other text. Do not use quotes.

User message: {user_msg}"""


# =============================================================================
# USER FACT EXTRACTION PROMPT
# Used by the background orchestrator to extract implicit facts from users.
# =============================================================================

user_fact_extraction_prompt = """Extract NEW factual information from the following USER message.
A valid fact is a DECLARATIVE STATEMENT where the user reveals something persistent about themselves.

For the "topic" field, use BROAD, reusable category names that group related facts together.
Good topics: "profile", "hobbies", "work", "relationships", "preferences"
Bad topics: "User's Name", "Favorite Color" (too specific — these create clutter)

Output format — a JSON list:
[{"topic": "profile", "text": "User is a computer scientist", "tags": ["bio"]}]

DO NOT EXTRACT:
- Questions, greetings, requests, or commands
- Transient state or small talk
- Information already known from context

If there is nothing new to extract, return exactly: []

Keep any <think> block EXTREMELY short (1-2 sentences).

User: {user_msg}"""


# =============================================================================
# ASSISTANT FACT EXTRACTION PROMPT
# Used to memorize concrete deliverables the assistant created.
# =============================================================================

assistant_fact_extraction_prompt = """Extract key factual information ONLY from substantive, user-requested content in the ASSISTANT's response.
ONLY extract facts if the assistant produced concrete deliverables the user asked for, such as:
- Code snippets or implementations
- Emails, documents, or templates
- Specific technical details, formulas, or configurations
- Research findings or data the user requested

Do NOT extract facts from:
- Normal conversational responses, greetings, or pleasantries
- General advice, recommendations, or resource lists
- Summaries or restatements of what the user said
- Any response that is just answering a simple question

Do NOT repeat facts the user already stated.
Format as a JSON list of objects with 'topic', 'text', and 'tags'.
If there are no relevant facts to store, return an empty list: []

Keep any <think> block EXTREMELY short (1 sentence or omit entirely).

User: {user_msg}
Assistant: {assistant_msg}"""


# =============================================================================
# SUMMARIZE PROMPT
# Used to compress chat history into context blocks during long sessions.
# =============================================================================

summarize_prompt = """Summarize the following conversation into concise factual statements. Focus on:
- Who the user is (name, role, background)
- What they are working on (projects, tools, goals)
- Key decisions, preferences, and constraints mentioned
- Any deliverables or outputs produced

Do NOT include conversational filler, greetings, or small talk.
Write the summary as a short paragraph (2-5 sentences).

Conversation:
{conversation}"""


# =============================================================================
# Fact Link Extraction Prompt
# Used by orchestrator.py to infer FactEdge links from a stored fact
# =============================================================================

fact_link_extraction_prompt = """You are a knowledge graph edge extractor.
You will be given a NEW FACT and a list of EXISTING FACTS (with IDs).
Identify if the NEW FACT is logically connected to any of the EXISTING FACTS. 

<new_fact>
{new_fact}
</new_fact>

<existing_facts>
{existing_facts}
</existing_facts>

Identify valid connections and extract precise triplets.
You must synthesize the context from both facts. For example, if the facts say "user's name is Tom" and "user studies at University", the triplet should connect the distinct concepts directly, like:
`source_entity`: "Tom"
`target_entity`: "University"
`relation`: "studies at"

DO NOT extract meaningless identity loops like "User -> same person -> User". However, if you can replace "User" with their actual name or a specific entity from the Existing Facts, do so!
If there are no meaningful connections between the entities, return exactly `[]`. Output NO OTHER TEXT.

Keep your <think> block EXTREMELY short (1 sentence max) or omit it entirely. Output exactly a JSON list of objects:
[
  {{"id": "existing_fact_id_here", "source_entity": "Subject", "target_entity": "Object", "relation": "relationship description"}}
]
"""
