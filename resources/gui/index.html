<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva — Knowledge Graph</title>

    <!-- QWebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <!-- Panels -->
    <iframe id="chat-frame" class="panel-iframe" src="chat.html"></iframe>
    <iframe id="graph-frame" class="panel-iframe" src="graph.html"></iframe>

    <!-- Settings Modal -->
    <div id="settings-modal" onclick="closeSettingsIfOutside(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <div class="modal-title">⚙️ System Settings</div>
            
            <div class="setting-group">
                <div class="setting-label">GPU Offload</div>
                <div class="slider-container">
                    <div class="slider-labels"><span>CPU</span><span>Full GPU</span></div>
                    <div class="slider-track-wrapper">
                        <input type="range" id="gpu-layer-slider" min="0" max="65" value="0" step="1">
                        <div class="slider-limit-marker" id="gpu-limit-marker" title="Maximum safe GPU layers based on VRAM"></div>
                    </div>
                    <div class="slider-info" id="layer-info">0 / 65 layers on GPU</div>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">Context Length</div>
                <div class="slider-container">
                    <div class="slider-labels"><span>2K</span><span>40K</span></div>
                    <div class="slider-track-wrapper">
                        <input type="range" id="ctx-slider" min="2048" max="40960" value="8192" step="1024">
                        <div class="slider-limit-marker" id="ctx-limit-marker" title="Maximum safe context length based on VRAM"></div>
                    </div>
                    <div class="slider-info" id="ctx-info">8,192 tokens</div>
                </div>
            </div>


            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeSettings()">Cancel</button>
                <button class="modal-btn save" onclick="saveSettings()">Save & Restart</button>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
