<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div id="chat-header">
        <span>💬 Minerva Chat</span>
        <div class="header-actions">
            <div class="dropdown-container">
                <button id="user-btn" onclick="toggleProfileDropdown()" title="Switch User">👤</button>
                <div id="profile-dropdown">
                    <div id="user-list">
                        <!-- Populated via JS -->
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="showAddProfileInput(event)" id="add-profile-item">
                        <span>➕</span> Add New Profile...
                    </div>
                    <div class="add-profile-input-container" id="add-profile-input-area">
                        <input type="text" id="new-profile-name" placeholder="Enter name..." onkeydown="handleNewProfileKeyDown(event)">
                    </div>
                </div>
            </div>
            <button id="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
        </div>
    </div>
    <!-- Model Warning Banner -->
    <div id="model-warning-banner" class="warning-banner" style="display: none;">
        <span id="warning-text"></span>
        <button onclick="hideModelWarning()" class="warning-close" title="Dismiss">✕</button>
    </div>

    <div id="chat-messages">
        <div class="msg system">Connected to Minerva. Your knowledge graph is loading…</div>
    </div>

    <div id="chat-input-area">
        <textarea id="chat-input" placeholder="Ask Minerva something…" rows="1"></textarea>
        <button id="send-btn" class="disabled" title="Send">▶</button>
    </div>

    <!-- Model Loader Overlay -->
    <div id="model-loader">
        <div class="loader-content">
            <div class="loader-text" id="loader-status">Loading AI Models</div>
            <div class="loader-bar-bg">
                <div class="loader-bar-fill"></div>
            </div>
            <div class="loader-subtext">This may take a moment on first launch...</div>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="delete-modal" class="custom-modal-backdrop" onclick="closeDeleteModalIfOutside(event)">
        <div class="custom-modal-container" onclick="event.stopPropagation()">
            <div class="custom-modal-title">🗑️ Delete Profile</div>
            <div class="custom-modal-body">
                Are you sure you want to delete profile <strong id="delete-target-name"></strong>? All associated memory data will be permanently removed.
            </div>
            <div class="custom-modal-actions">
                <button class="custom-modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="custom-modal-btn delete" id="confirm-delete-btn" onclick="executePendingDelete()">Delete Profile</button>
            </div>
        </div>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
